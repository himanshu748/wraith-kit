name: Demo verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      WRAITH_LLM_PROVIDER: none
      WRAITH_LIVE_ISSUES: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: wraith-browser-demo
          path: output/playwright/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: wraith-judge-build
          path: output/wraith-kit-judge.zip
          if-no-files-found: error
